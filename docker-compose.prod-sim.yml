version: '3.9'

# WARNING: This file is for LOCAL prod-sim testing ONLY.
# DO NOT deploy to real infrastructure with these default credentials.
# Override all secrets via environment variables or a .env file.

# Production simulation — runs all services from built images.
# Build images first:
#   docker build -t bramha-api:latest -f infra/docker/Dockerfile.api .
#   docker build -t bramha-web:latest -f infra/docker/Dockerfile.web .
#   docker build -t bramha-agent-runtime:latest -f infra/docker/Dockerfile.agent-runtime .
#   docker build -t bramha-ingestion:latest -f infra/docker/Dockerfile.ingestion .
#   docker build -t bramha-sandbox-executor:latest -f infra/docker/sandbox/Dockerfile.sandbox-executor infra/docker/sandbox
#   docker build -t bramha-sandbox-host:latest -f infra/docker/sandbox/Dockerfile.sandbox-host .
# Then:
#   docker compose -f docker-compose.prod-sim.yml up

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bramha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bramha_dev_local}
      POSTGRES_DB: bramha
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bramha']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: bramha
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bramha_dev_local}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: bramha-api:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://bramha:bramha_dev@postgres:5432/bramha
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-32-chars-minimum!!}
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: bramha-web:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  agent-runtime:
    image: bramha-agent-runtime:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent-runtime
    environment:
      DATABASE_URL: postgresql://bramha:bramha_dev@postgres:5432/bramha
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-worker:
    image: bramha-ingestion:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ingestion
    environment:
      DATABASE_URL: postgresql://bramha:bramha_dev@postgres:5432/bramha
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: bramha
      S3_SECRET_KEY: bramha_dev
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', "require('fs').statSync('/app/dist/main.js')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sandbox-host:
    image: bramha-sandbox-host:latest
    build:
      context: .
      dockerfile: infra/docker/sandbox/Dockerfile.sandbox-host
    volumes:
      # Docker socket — sandbox-host spawns sibling containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Seccomp profile mounted into sandbox-host so it can pass the path to docker run
      - ./infra/docker/sandbox/seccomp-profile.json:/etc/bramha/seccomp-profile.json:ro
    environment:
      SANDBOX_IMAGE: bramha-sandbox-executor:latest
      SANDBOX_RUNTIME: runc
      # For gVisor in prod: SANDBOX_RUNTIME: runsc
      SECCOMP_PROFILE_PATH: /etc/bramha/seccomp-profile.json
    ports:
      - '4200:4200'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4200/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  minio_data:
