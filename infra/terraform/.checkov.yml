# Checkov configuration for BramhaV2 Terraform
# Run: checkov -d infra/terraform --config-file infra/terraform/.checkov.yml

framework:
  - terraform

# Directories to scan
directory:
  - .

# Skip checks with documented rationale
skip-check:
  # CKV_AWS_19: S3 access logging — the audit-export bucket acts as the
  # central log target; individual bucket logging targets it. A separate
  # dedicated logging bucket (CKV_AWS_19) is out of scope for T5.2 but
  # configured in the access_log_bucket_name variable for production override.
  - CKV_AWS_19

  # CKV_AWS_86: CloudFront logging — CloudFront/WAF is T5.3, not T5.2.
  - CKV_AWS_86

  # CKV_AWS_91: ALB access logging — requires a separate S3 logging bucket
  # with specific bucket policy; planned for T5.5 (observability).
  - CKV_AWS_91

  # CKV_AWS_150: ALB deletion protection is enabled. This check fires for
  # staging because staging intentionally sets deletion_protection=false on
  # RDS to allow easy teardown; ALB deletion_protection is TRUE.
  # No actual skip needed but documented here for clarity.

  # CKV2_AWS_5: Security groups not attached — false positive; SGs are
  # referenced by ECS services and RDS but checkov may not trace cross-module.
  - CKV2_AWS_5

# Soft-fail on non-critical informational checks
soft-fail-on:
  - MEDIUM

# Output format
output: cli
compact: false
