name: bramhav2-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bramha_dev
      POSTGRES_USER: bramha_dev
      POSTGRES_PASSWORD: dev_only_postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bramha_dev -d bramha_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    # Redis data is intentionally ephemeral in dev (no volume mount)
    image: redis:7-alpine
    command: redis-server --requirepass dev_only_redis_password
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_only_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev_only_minio_root
      MINIO_ROOT_PASSWORD: dev_only_minio_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 dev_only_minio_root dev_only_minio_password;
        mc mb --ignore-existing local/bramha-staging;
        mc mb --ignore-existing local/bramha-clean;
        mc mb --ignore-existing local/bramha-quarantine;
        mc mb --ignore-existing local/bramha-artifacts;
        mc anonymous set none local/bramha-staging;
        mc anonymous set none local/bramha-clean;
        mc anonymous set none local/bramha-quarantine;
        mc anonymous set none local/bramha-artifacts;
        echo 'MinIO buckets initialized with private ACLs';
      "
    networks:
      - app
      - data

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - app
      - mcp-isolated  # reachable by MCP servers on the isolated network

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: dev_only_admin
      GF_SECURITY_ADMIN_PASSWORD: dev_only_grafana_password
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app

  loki:
    image: grafana/loki:latest
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - app

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app

networks:
  app:
    driver: bridge
  data:
    driver: bridge
  mcp-isolated:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  minio_data:
  clamav_data:
