name: Build & Publish Docker Images

on:
  push:
    branches: [main, "claude/multi-agent-ai-orchestration-zt6xvw"]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write    # OIDC for AWS ECR + cosign
  packages: write    # GitHub Container Registry (fallback)

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}  # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-push:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: api, dockerfile: infra/docker/Dockerfile.api, context: . }
          - { name: web, dockerfile: apps/web/Dockerfile, context: . }
          - { name: agent-runtime, dockerfile: infra/docker/Dockerfile.agent-runtime, context: . }
          - { name: ingestion-worker, dockerfile: infra/docker/Dockerfile.ingestion, context: . }
          - { name: sandbox-host, dockerfile: infra/docker/Dockerfile.sandbox-host, context: . }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:${{ github.ref_name }},${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:${SHA_SHORT},${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:latest-main" >> $GITHUB_OUTPUT
          fi

      - name: Build image (no push yet — scan first)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json

      - name: Scan image (trivy) — fail on CRITICAL/HIGH unfixed
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/bramha-${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            cosign sign --yes "${tag}@${{ steps.push.outputs.digest }}"
          done

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.spdx.json
          retention-days: 90

