packages:
  - "apps/*"
  - "packages/*"
  - "infra/sandbox"
# Single ioredis in tree — bullmq pins an older one, causing Redis-type
# incompatibility (Redis !assignable to ConnectionOptions) under strict TS.
overrides:
  ioredis: ^5.11.1
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: true
  argon2: true
  es5-ext: true
  msgpackr-extract: true
  sharp: false
  protobufjs: true
